<app-header-back [title]="associationName"></app-header-back>

<ion-content fullscreen>
  <div class="sticky-search">
    <app-search-bar (searchChange)="onSearchChange($event)"></app-search-bar>
  </div>

  <div class="children-list">
    <div class="child-card" *ngFor="let c of filtered">
      <div class="left">
        <img [src]="c.avatar" [alt]="c.name" />
      </div>
      <div class="middle">
        <div class="top">
          <div class="name">{{ c.name }}</div>
          <div class="grade">{{ c.grade }}</div>
        </div>
        <div class="actions">
          <ion-button
            size="small"
            fill="solid"
            class="profile-btn"
            [routerLink]="['/profil-enfant', c.id]"
            >Voir profil</ion-button
          >
          <ion-button
            size="small"
            fill="solid"
            class="sponsor-btn"
            (click)="openSponsorConfirm(c)"
            >Parrainer</ion-button
          >
        </div>
      </div>
    </div>
  </div>
</ion-content>

<app-footer-tabs></app-footer-tabs>

<!-- Modal de confirmation Parrainer -->
<div class="sponsor-modal" *ngIf="showConfirm">
  <div class="backdrop" (click)="closeSponsorConfirm()"></div>
  <div class="sheet">
    <div class="content">
      <div class="text">Voulez-vous vraiment parrainer cet enfant ?</div>
      <div class="actions">
        <ion-button class="cancel" (click)="closeSponsorConfirm()">Annuler</ion-button>
        <ion-button class="confirm" (click)="confirmSponsor()">Confirmer</ion-button>
      </div>
    </div>
  </div>
  
</div>
