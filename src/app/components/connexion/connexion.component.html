<ion-content class="ion-padding">

  <div class="top-circle-background">
    <div class="logo-text-container">
      <img src="assets/icon/image.png" alt="Logo Daimai" class="logo">
      <h2 class="daimai-text">DAIMAI</h2>
    </div>
  </div>

  <h1 class="welcome-message">Inscrivez-vous pour nous rejoindre</h1>

  <form (ngSubmit)="submitForm()">
    
    <ion-item class="input-item">
      <ion-input type="text" [(ngModel)]="prenom" name="prenom" placeholder="Prénom"></ion-input>
    </ion-item>

    <ion-item class="input-item">
      <ion-input type="text" [(ngModel)]="nom" name="nom" placeholder="Nom"></ion-input>
    </ion-item>

    <ion-item class="input-item">
      <ion-input type="tel" [(ngModel)]="telephone" name="telephone" placeholder="Téléphone"></ion-input>
    </ion-item>

    <ion-item class="input-item">
      <ion-input type="email" [(ngModel)]="email" name="email" placeholder="Adresse e-mail"></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" class="submit-button" (click)="goToNextPage()">
      Suivant
    </ion-button>
  </form>

  <p class="login-link">
    Vous avez déjà un compte ? <a routerLink="/connexion">Connectez vous</a>
  </p>

</ion-content>
